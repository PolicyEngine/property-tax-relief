name: Verify research and interactive
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - uses: astral-sh/setup-uv@v6
      - run: bun install --frozen-lockfile
      - run: uv sync --locked
      - run: bun run typecheck
      - run: bun run test
      - run: uv run pytest
      - run: bun run artifacts:build
      - run: bun run playwright-cli install-browser chrome --with-deps
      - run: bun run scripts/browser_qa.mjs
      - run: bun run build:zone
      - run: QA_BASE_PATH=/us/rent-and-property-taxes bun run scripts/browser_qa.mjs
      - name: Verify published PolicyEngine route
        if: github.event_name == 'workflow_dispatch'
        run: QA_LIVE_URL=https://www.policyengine.org/us/rent-and-property-taxes/ QA_BASE_PATH=/us/rent-and-property-taxes bun run scripts/browser_qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-qa
          path: |
            output/playwright/
            output/playwright-zone/
            output/playwright-live/

[project]
name = "property-tax-relief"
version = "0.1.0"
description = "Reproducible national property-tax relief research"
requires-python = ">=3.13,<3.14"
dependencies = ["policyengine[us]==6.19.0", "requests>=2.32"]

[dependency-groups]
dev = ["pytest>=8", "hypothesis>=6.100", "ruff>=0.9"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
